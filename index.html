<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>משחק 5: הגדרת היגיון</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f8fafc;
    color: #1e293b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
  }
  .card {
    background: white;
    padding: 32px 20px;
    border-radius: 24px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.08);
    max-width: 450px;
    width: 100%;
    border: 1px solid #e2e8f0;
  }
  h1 {
    color: #0f172a;
    font-size: 1.55rem;
    margin-top: 0;
    margin-bottom: 6px;
  }
  .badge {
    display: inline-block;
    background: #e0e7ff;
    color: #4338ca;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 18px;
  }
  .riddle-box {
    background: #f1f5f9;
    border-right: 4px solid #6366f1;
    padding: 16px;
    border-radius: 12px;
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.6;
    color: #1e293b;
    margin-bottom: 25px;
    text-align: right;
  }

  /* לוח תשבץ */
  .crossword-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
    direction: rtl;
  }
  .word-group {
    display: flex;
    gap: 4px;
  }
  .crossword-cell {
    width: 36px;
    height: 46px;
    border: 2px solid #94a3b8;
    border-radius: 8px;
    font-size: 1.4rem;
    font-weight: 800;
    text-align: center;
    background: #fff;
    color: #0f172a;
    outline: none;
    caret-color: #6366f1;
    transition: all 0.2s ease;
  }
  .crossword-cell:focus {
    border-color: #6366f1;
    background: #eef2ff;
  }
  .crossword-cell.hint-revealed {
    background-color: #fef08a !important;
    border-color: #ca8a04 !important;
    color: #854d0e !important;
  }

  .btn-submit {
    background: #6366f1;
    color: white;
    border: none;
    padding: 14px 34px;
    font-size: 1.15rem;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    width: 90%;
    transition: 0.2s;
    touch-action: manipulation;
  }
  .btn-submit:active {
    background: #4f46e5;
    transform: scale(0.98);
  }
  .btn-hint {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    color: #475569;
    padding: 10px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 15px;
    transition: 0.2s;
    touch-action: manipulation;
  }
  .btn-hint:hover { background: #e2e8f0; }

  .feedback {
    margin-top: 14px;
    font-size: 0.95rem;
    font-weight: bold;
    min-height: 24px;
    color: #ef4444;
  }

  .hidden { display: none !important; }
  .win { animation: fadeIn 0.7s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="card">
  <h1>משחק 5: הגדרת היגיון 🧩</h1>
  <div class="badge">למיטיבי לכת</div>

  <div id="game-section">
    <div class="riddle-box">
      "הקוף כאן, אבל איפה שפירא? אוכלת בתל אביב" (3, 6)
    </div>

    <!-- לוח התשבץ -->
    <div class="crossword-container">
      <div class="word-group">
        <input type="text" class="crossword-cell" maxlength="1" id="c0">
        <input type="text" class="crossword-cell" maxlength="1" id="c1">
        <input type="text" class="crossword-cell" maxlength="1" id="c2">
      </div>
      <div class="word-group">
        <input type="text" class="crossword-cell" maxlength="1" id="c3">
        <input type="text" class="crossword-cell" maxlength="1" id="c4">
        <input type="text" class="crossword-cell" maxlength="1" id="c5">
        <input type="text" class="crossword-cell" maxlength="1" id="c6">
        <input type="text" class="crossword-cell" maxlength="1" id="c7">
        <input type="text" class="crossword-cell" maxlength="1" id="c8">
      </div>
    </div>

    <button type="button" class="btn-submit" id="submitBtn">בדקי פתרון</button>
    <br>
    <button type="button" class="btn-hint" id="hintBtn">💡 חשפי רמז במשבצת</button>

    <div id="feedback" class="feedback"></div>
  </div>

  <div id="win-section" class="hidden win">
    <div style="font-size: 3.5rem; margin: 10px 0;">☕ 🇮🇹 🍝</div>
    <h2 style="color: #6366f1; font-size: 1.85rem; margin: 10px 0;">מושלם! פיצחת! 🎉</h2>
    <p style="font-size: 1.2rem; line-height: 1.7; color: #334155;">
      <strong>קפה איטליה!</strong><br><br>
      פירוק היגיון פשוט מבריק! 👏<br><br>
      גשי מיד ל<strong>דודאווי</strong> ודרשי לקבל את המתנה החמישית שלך!
    </p>
  </div>
</div>

<script>
  var solution = ["ק", "פ", "ה", "א", "י", "ט", "ל", "י", "ה"];

  // 3 רמזים לפי הסדר המבוקש:
  // 1: אות 2 במילה הראשונה (פ)
  // 3: אות ראשונה במילה השנייה (א)
  // 5: אות שלישית במילה השנייה (ט)
  var hintSteps = [
    { id: "c1", letter: "פ" },
    { id: "c3", letter: "א" },
    { id: "c5", letter: "ט" }
  ];
  var currentHintIdx = 0;

  var cellIds = ["c0", "c1", "c2", "c3", "c4", "c5", "c6", "c7", "c8"];

  cellIds.forEach(function(id, idx) {
    var cell = document.getElementById(id);
    cell.addEventListener("input", function() {
      if (cell.value && idx < cellIds.length - 1) {
        document.getElementById(cellIds[idx + 1]).focus();
      }
    });

    cell.addEventListener("keydown", function(e) {
      if (e.key === "Backspace" && !cell.value && idx > 0) {
        document.getElementById(cellIds[idx - 1]).focus();
      } else if (e.key === "Enter") {
        checkAnswer();
      }
    });
  });

  document.getElementById("hintBtn").addEventListener("click", function() {
    if (currentHintIdx < hintSteps.length) {
      var item = hintSteps[currentHintIdx];
      var el = document.getElementById(item.id);
      el.value = item.letter;
      el.classList.add("hint-revealed");
      el.readOnly = true;
      currentHintIdx++;

      if (currentHintIdx >= hintSteps.length) {
        this.textContent = "נגמרו הרמזים!";
        this.disabled = true;
        this.style.opacity = "0.6";
      }
    }
  });

  function checkAnswer() {
    var entered = cellIds.map(function(id) {
      return document.getElementById(id).value.trim();
    }).join("");

    var fb = document.getElementById("feedback");

    if (entered.length < 9) {
      fb.textContent = "מלאי את כל 9 המשבצות!";
      return;
    }

    if (entered === solution.join("")) {
      fb.textContent = "";
      document.getElementById("game-section").classList.add("hidden");
      document.getElementById("win-section").classList.remove("hidden");
    } else {
      fb.textContent = "עדיין לא נכון... נסי שוב!";
    }
  }

  document.getElementById("submitBtn").addEventListener("click", checkAnswer);
</script>
</body>
</html>
